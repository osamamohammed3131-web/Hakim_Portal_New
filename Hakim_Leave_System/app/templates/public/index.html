<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام الإجازات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7fa;
            color: #526575;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* الشريط العلوي */
        .header {
            height: 82px;
            background: #ffffff;
            border-bottom: 1px solid #e4e9ed;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #087dbb;
            font-size: 23px;
            font-weight: bold;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #087dbb;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .nav a {
            color: #607584;
            text-decoration: none;
            margin-right: 25px;
            font-size: 15px;
            font-weight: bold;
        }

        .nav a:hover {
            color: #087dbb;
        }

        /* القسم الرئيسي */
        .hero {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 75px 25px 90px;
            text-align: center;
        }

        .hero h1 {
            margin: 0 0 22px;
            color: #087dbb;
            font-size: 42px;
            font-weight: 800;
        }

        .hero p {
            margin: 0 auto 40px;
            max-width: 780px;
            color: #71808d;
            font-size: 19px;
            line-height: 2;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            min-width: 210px;
            padding: 15px 28px;
            border-radius: 7px;
            background: #087dbb;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #066b9f;
        }

        .button.secondary {
            background: #ffffff;
            color: #087dbb;
            border: 1px solid #087dbb;
        }

        .button.secondary:hover {
            background: #f0f8fc;
        }

        /* الفوتر */
        .footer {
            background: #087dbb;
            color: #ffffff;
            text-align: center;
            padding: 38px 20px;
        }

        .footer-title {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .footer-text {
            font-size: 15px;
            line-height: 2;
            opacity: 0.95;
        }

        .copyright {
            margin-top: 18px;
            font-size: 12px;
            opacity: 0.8;
        }

        /* الجوال */
        @media (max-width: 700px) {

            .header {
                height: auto;
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav {
                text-align: center;
            }

            .nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            .hero {
                padding: 55px 20px 70px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 17px;
            }

            .button {
                width: 100%;
                max-width: 330px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="logo">
            <div class="logo-icon">✓</div>
            <span>نظام الإجازات</span>
        </div>

        <nav class="nav">
            <a href="/">الرئيسية</a>
            <a href="/lookup">الاستعلام عن طلب</a>
        </nav>

    </header>


    <main class="hero">

        <h1>نظام الإجازات</h1>

        <p>
            خدمة إلكترونية تتيح لك الاستعلام عن حالة طلبات الإجازة
            والغياب المسجلة داخل النظام بكل سهولة.
        </p>

        <div class="buttons">

            <a href="/lookup" class="button">
                الاستعلام عن طلب
            </a>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-title">
            نظام الإجازات
        </div>

        <div class="footer-text">
            نظام إلكتروني لإدارة ومتابعة طلبات الإجازات
            <br>
            بطريقة سهلة ومنظمة.
        </div>

        <div class="copyright">
            جميع الحقوق محفوظة © 2026
        </div>

    </footer>

</div>

</body>
</html>
