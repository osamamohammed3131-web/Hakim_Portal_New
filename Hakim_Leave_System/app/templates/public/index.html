{% extends "base.html" %}

{% block content %}

<section class="page-container">

    <h1 class="page-title">
        الإجازات المرضية
    </h1>

    <p class="page-description">
        خدمة الاستعلام عن الإجازات المرضية تتيح لك الاستعلام عن حالة
        طلب الإجازة ويمكنك طباعتها عن طريق تطبيق صحتي.
    </p>

    <div class="lookup-form">

        <div class="input-group">
            <input
                type="text"
                class="form-input"
                name="service_number"
                placeholder="رقم الخدمة"
                autocomplete="off">
        </div>

        <div class="input-group">
            <input
                type="text"
                class="form-input"
                name="identity_number"
                placeholder="رقم الهوية / الإقامة"
                autocomplete="off">
        </div>

        <div class="button-row">

            <button
                type="button"
                class="primary-button"
                onclick="window.location.href='/lookup'">
                استعلام
            </button>

            <a
                href="/lookup"
                class="secondary-button"
                style="display:flex;align-items:center;justify-content:center;">
                رجوع للاستعلامات
            </a>

        </div>

    </div>

</section>

{% endblock %}
