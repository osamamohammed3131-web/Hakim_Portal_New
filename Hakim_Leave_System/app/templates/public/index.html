{% extends "base.html" %}

{% block title %}
الإجازات المرضية
{% endblock %}

{% block content %}

<section class="container">

    <div class="card">

        <h1 class="page-title">
            الإجازات المرضية
        </h1>

        <p class="page-description">
            خدمة الاستعلام عن الإجازات المرضية تتيح لك الاستعلام
            عن حالة طلب الإجازة ويمكنك طباعتها عن طريق تطبيق صحي
        </p>

        <div class="form-container">

            <form action="/lookup" method="get">

                <input
                    type="text"
                    name="service_number"
                    class="input-field"
                    placeholder="رقم الخدمة"
                    autocomplete="off"
                    required
                >

                <input
                    type="text"
                    name="identity_number"
                    class="input-field"
                    placeholder="رقم الهوية / الإقامة"
                    autocomplete="off"
                    required
                >

                <div class="buttons">

                    <button
                        type="submit"
                        class="lookup-button"
                    >
                        استعلام
                    </button>

                    <a
                        href="/lookup"
                        class="back-button"
                    >
                        رجوع للاستعلامات
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
