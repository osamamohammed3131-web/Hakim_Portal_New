{% extends "base.html" %}

{% block content %}

<section class="lookup-container">

    <h1 class="lookup-title">
        الاستعلام عن طلب
    </h1>

    <p class="lookup-description">
        يمكنك الاستعلام عن طلبك المسجل في المنصة
        باستخدام رقم الطلب ورقم الهوية / الإقامة.
    </p>

    <form
        method="post"
        action="/lookup"
        class="lookup-form"
    >

        <input
            type="text"
            name="request_number"
            placeholder="رقم الطلب"
            autocomplete="off"
            required
        >

        <input
            type="text"
            name="national_id"
            placeholder="رقم الهوية / الإقامة"
            autocomplete="off"
            required
        >

        <button
            type="submit"
            class="lookup-submit"
        >
            استعلام
        </button>

        <a
            href="/"
            class="lookup-back"
        >
            رجوع
        </a>

    </form>

    {% if error %}

    <div class="result-box">
        {{ error }}
    </div>

    {% endif %}

</section>

{% endblock %}
