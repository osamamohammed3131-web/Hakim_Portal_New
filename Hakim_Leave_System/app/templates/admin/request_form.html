{% extends "base.html" %}{% block content %}<main class="container"><h1>تسجيل طلب جديد</h1><form method="post" class="card"><input name="student_name" placeholder="اسم الطالب" required><input name="national_id" placeholder="رقم الهوية / الإقامة" required><select name="university_id" required>{% for u in universities %}<option value="{{u.id}}">{{u.name}}</option>{% endfor %}</select><label>تاريخ الغياب<input type="date" name="absence_date" required></label><label>من<input type="date" name="start_date" required></label><label>إلى<input type="date" name="end_date" required></label><select name="request_type"><option>إجازة</option><option>غياب</option><option>عذر</option><option>طلب تسجيل</option></select><textarea name="notes" placeholder="ملاحظات"></textarea><button>حفظ وإنشاء الطلب</button></form></main>{% endblock %}
