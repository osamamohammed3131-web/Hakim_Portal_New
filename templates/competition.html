<script>


/* =========================================================
   المتغيرات
========================================================= */

let sessionId = null;

let deviceNumber = null;

let screenStream = null;

let competitionRunning = false;

let captureTimer = null;

let resultTimer = null;

let lastFrameSignature = null;

let lastSubmittedSignature = null;

let currentQuestionNumber = 1;

let lastShownQuestion = null;

let lastShownAnswer = null;

let answerHideTimer = null;

let pipWindow = null;

let pipAnswerBox = null;

let pipQuestionBox = null;

let pipStatusBox = null;

let pipTimerBox = null;


/* =========================================================
   الإعدادات
========================================================= */

const CAPTURE_INTERVAL = 1200;

const RESULT_INTERVAL = 700;

const ANSWER_DISPLAY_TIME = 10000;


/* =========================================================
   العناصر
========================================================= */

const statusText =
    document.getElementById(
        "statusText"
    );

const deviceNumberElement =
    document.getElementById(
        "deviceNumber"
    );

const deviceText =
    document.getElementById(
        "deviceText"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const pipButton =
    document.getElementById(
        "pipButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const preview =
    document.getElementById(
        "preview"
    );

const screenVideo =
    document.getElementById(
        "screenVideo"
    );

const aiStatus =
    document.getElementById(
        "aiStatus"
    );


/* =========================================================
   الرسالة
========================================================= */

function showMessage(
    message,
    color = "#1769d1"
) {

    messageElement.textContent =
        message;

    messageElement.style.color =
        color;

}


/* =========================================================
   إنشاء جلسة
========================================================= */

async function createSession() {

    try {

        const response =
            await fetch(
                "/api/competition/session",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "تعذر إنشاء الجلسة"
            );

        }

        sessionId =
            data.session_id;

        deviceNumber =
            data.device_number;

        deviceNumberElement.textContent =
            deviceNumber;

        deviceText.textContent =
            deviceNumber;

        statusText.textContent =
            "الجلسة جاهزة";

        showMessage(
            "الجلسة جاهزة للمنافسة."
        );

    } catch (error) {

        statusText.textContent =
            "خطأ";

        showMessage(
            error.message,
            "#dc2626"
        );

    }

}


/* =========================================================
   فحص Gemini
========================================================= */

async function checkAIHealth() {

    try {

        const response =
            await fetch(
                "/api/competition/ai-health",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (
            response.ok
            &&
            data.status === "ready"
        ) {

            aiStatus.textContent =
                "Gemini جاهز ✓";

        } else {

            aiStatus.textContent =
                "Gemini غير جاهز";

            aiStatus.style.background =
                "#fee2e2";

            aiStatus.style.color =
                "#b91c1c";

        }

    } catch (error) {

        aiStatus.textContent =
            "تعذر الاتصال";

        aiStatus.style.background =
            "#fee2e2";

        aiStatus.style.color =
            "#b91c1c";

    }

}


/* =========================================================
   فتح نافذة Hakim AI العائمة
========================================================= */

async function openFloatingWindow() {

    /*
     * إذا كانت النافذة موجودة بالفعل
     * لا ننشئ نافذة ثانية.
     */

    if (
        pipWindow
        &&
        !pipWindow.closed
    ) {

        return;

    }


    /*
     * التحقق من دعم المتصفح.
     */

    if (
        !("documentPictureInPicture" in window)
    ) {

        showMessage(
            "المتصفح لا يدعم النافذة العائمة. استخدم Chrome أو Edge حديث.",
            "#dc2626"
        );

        return;

    }


    try {

        pipWindow =
            await window
                .documentPictureInPicture
                .requestWindow({

                    width: 340,

                    height: 220,

                    disallowReturnToOpener:
                        false,

                    preferInitialWindowPlacement:
                        true

                });


        /*
         * إعداد صفحة النافذة العائمة.
         */

        pipWindow.document.body.innerHTML = `

            <div
                id="hakimFloatingBox"
                style="
                    width:100%;
                    height:100%;
                    background:white;
                    color:#111827;
                    font-family:Arial,sans-serif;
                    padding:18px;
                    border:3px solid #1769d1;
                    border-radius:18px;
                    box-sizing:border-box;
                    text-align:center;
                "
            >

                <div
                    style="
                        color:#1769d1;
                        font-size:18px;
                        font-weight:bold;
                        margin-bottom:8px;
                    "
                >
                    🤖 Hakim AI
                </div>


                <div
                    id="pipQuestion"
                    style="
                        color:#777;
                        font-size:14px;
                        margin-bottom:12px;
                    "
                >
                    في انتظار السؤال...
                </div>


                <div
                    style="
                        font-size:13px;
                        color:#555;
                    "
                >
                    الإجابة الصحيحة
                </div>


                <div
                    id="pipAnswer"
                    style="
                        font-size:46px;
                        font-weight:bold;
                        margin-top:5px;
                    "
                >
                    —
                </div>


                <div
                    id="pipStatus"
                    style="
                        color:#16a34a;
                        font-weight:bold;
                        font-size:13px;
                        margin-top:5px;
                    "
                >
                    جاهز
                </div>


                <div
                    id="pipTimer"
                    style="
                        color:#777;
                        font-size:11px;
                        margin-top:5px;
                    "
                >
                    —
                </div>

            </div>
        `;


        /*
         * الحصول على العناصر داخل النافذة.
         */

        pipAnswerBox =
            pipWindow.document
                .getElementById(
                    "pipAnswer"
                );

        pipQuestionBox =
            pipWindow.document
                .getElementById(
                    "pipQuestion"
                );

        pipStatusBox =
            pipWindow.document
                .getElementById(
                    "pipStatus"
                );

        pipTimerBox =
            pipWindow.document
                .getElementById(
                    "pipTimer"
                );


        /*
         * عند إغلاق النافذة.
         */

        pipWindow.addEventListener(
            "pagehide",
            () => {

                pipWindow = null;

                pipAnswerBox = null;

                pipQuestionBox = null;

                pipStatusBox = null;

                pipTimerBox = null;

                if (competitionRunning) {

                    showMessage(
                        "تم إغلاق النافذة العائمة. يمكنك إظهارها مرة أخرى."
                    );

                }

            }
        );


        showMessage(
            "نافذة Hakim AI العائمة جاهزة."
        );


    } catch (error) {

        pipWindow = null;

        showMessage(
            "تعذر فتح النافذة العائمة: "
            +
            error.message,
            "#dc2626"
        );

    }

}


/* =========================================================
   بدء المنافسة
========================================================= */

async function startCompetition() {

    if (
        competitionRunning
    ) {

        return;

    }


    if (!sessionId) {

        showMessage(
            "الجلسة لم تجهز بعد.",
            "#dc2626"
        );

        return;

    }


    try {

        startButton.disabled =
            true;


        statusText.textContent =
            "جاري تجهيز النافذة العائمة...";


        /*
         * مهم:
         * نفتح نافذة PiP أثناء ضغطة المستخدم
         * قبل الانتظار الطويل لمشاركة الشاشة.
         */

        await openFloatingWindow();


        /*
         * الآن نطلب مشاركة الشاشة.
         */

        showMessage(
            "اختر نافذة معرض الصور فقط."
        );


        screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: {

                        frameRate: 5

                    },

                    audio: false

                });


        screenVideo.srcObject =
            screenStream;


        await screenVideo.play();


        preview.style.display =
            "block";


        competitionRunning =
            true;


        stopButton.disabled =
            false;


        pipButton.disabled =
            false;


        statusText.textContent =
            "مشاركة الشاشة تعمل";


        showMessage(
            "تمت المشاركة. اعرض صور الأسئلة في معرض الصور."
        );


        lastFrameSignature =
            null;


        lastSubmittedSignature =
            null;


        startFrameCapture();


        startResultPolling();


        const track =
            screenStream
                .getVideoTracks()[0];


        if (track) {

            track.addEventListener(
                "ended",
                () => {

                    stopCompetition();

                }
            );

        }


    } catch (error) {

        competitionRunning =
            false;


        startButton.disabled =
            false;


        stopButton.disabled =
            true;


        statusText.textContent =
            "لم تبدأ المنافسة";


        showMessage(
            "لم يتم بدء المشاركة: "
            +
            error.message,
            "#dc2626"
        );

    }

}


/* =========================================================
   التقاط الإطارات
========================================================= */

function startFrameCapture() {

    if (captureTimer) {

        clearInterval(
            captureTimer
        );

    }


    captureCurrentFrame();


    captureTimer =
        setInterval(
            captureCurrentFrame,
            CAPTURE_INTERVAL
        );

}


/* =========================================================
   التقاط صورة
========================================================= */

async function captureCurrentFrame() {

    if (
        !competitionRunning
        ||
        !screenVideo.videoWidth
        ||
        !screenVideo.videoHeight
    ) {

        return;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const width =
        960;


    const height =
        Math.round(
            (
                screenVideo.videoHeight
                /
                screenVideo.videoWidth
            )
            *
            width
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const context =
        canvas.getContext(
            "2d"
        );


    context.drawImage(
        screenVideo,
        0,
        0,
        width,
        height
    );


    const signature =
        createFrameSignature(
            canvas
        );


    if (
        signature ===
        lastFrameSignature
    ) {

        return;

    }


    lastFrameSignature =
        signature;


    if (
        signature ===
        lastSubmittedSignature
    ) {

        return;

    }


    lastSubmittedSignature =
        signature;


    await sendFrame(
        canvas
    );

}


/* =========================================================
   بصمة الإطار
========================================================= */

function createFrameSignature(
    canvas
) {

    const sampleWidth =
        48;


    const sampleHeight =
        27;


    const sampleCanvas =
        document.createElement(
            "canvas"
        );


    sampleCanvas.width =
        sampleWidth;


    sampleCanvas.height =
        sampleHeight;


    const sampleContext =
        sampleCanvas.getContext(
            "2d"
        );


    sampleContext.drawImage(
        canvas,
        0,
        0,
        sampleWidth,
        sampleHeight
    );


    const data =
        sampleContext.getImageData(
            0,
            0,
            sampleWidth,
            sampleHeight
        ).data;


    let hash =
        2166136261;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        hash ^= data[i];

        hash =
            Math.imul(
                hash,
                16777619
            );


        hash ^= data[i + 1];

        hash =
            Math.imul(
                hash,
                16777619
            );


        hash ^= data[i + 2];

        hash =
            Math.imul(
                hash,
                16777619
            );

    }


    return (
        hash >>> 0
    ).toString(16);

}


/* =========================================================
   إرسال الإطار
========================================================= */

async function sendFrame(
    canvas
) {

    if (!sessionId) {

        return;

    }


    try {

        const blob =
            await new Promise(
                resolve => {

                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.82
                    );

                }
            );


        if (!blob) {

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "image",
            blob,
            "question.jpg"
        );


        const response =
            await fetch(

                "/api/competition/session/"
                +
                sessionId
                +
                "/frame",

                {

                    method:
                        "POST",

                    body:
                        formData

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.error ||
                "تعذر إرسال الصورة",
                "#dc2626"
            );

            return;

        }


        if (
            data.question_number
        ) {

            currentQuestionNumber =
                data.question_number;


            questionText.textContent =
                data.question_number;

        }


        if (
            data.answer_status ===
            "processing"
