<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hakim AI Competition</title>

        }

        header {
            background: white;

            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #1769d1;
            font-size: 22px;
        }

        .device {

        .container {

            padding: 0 20px;
        }

            padding: 25px;

        .status strong {
            color: #1769d1;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {

            padding: 14px 22px;
            font-size: 15px;
            cursor: pointer;
        }

        #startButton {
            background: #1769d1;
            color: white;
        }

        #stopButton {
            background: #dc2626;
            color: white;
        }

            opacity: 0.45;
            cursor: not-allowed;
        }

        #message {

            min-height: 25px;
            font-weight: bold;
        }
