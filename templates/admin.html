<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة المشرف - حكيم أكاديمي</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #1769d1;
            font-size: 25px;
        }

        .user {
            color: #555;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .welcome h2 {
            margin-top: 0;
            color: #1769d1;
        }

        .sections {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 25px;
            min-height: 140px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #1769d1;
        }

        .card p {
            color: #777;
            line-height: 1.7;
        }

        .logout {
            margin-top: 25px;
            background: #1769d1;
            color: white;
            border: 0;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        /* =====================================================
           الأقسام الداخلية
        ===================================================== */

        .management-section {
            display: none;
            margin-top: 30px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .section-header h2 {
            color: #1769d1;
            margin: 0;
        }

        .add-button {
            background: #1769d1;
            color: white;
            border: 0;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .back-button {
            background: #6b7280;
            color: white;
            border: 0;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* =====================================================
           البحث
        ===================================================== */

        .search {
            width: 100%;
            padding: 13px;
            margin: 20px 0;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        /* =====================================================
           الجداول
        ===================================================== */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: right;
        }

        th {
            background: #f5f7fb;
        }

        /* =====================================================
           الحالات
        ===================================================== */

        .status-active {
            color: #16a34a;
            font-weight: bold;
        }

        .status-disabled {
            color: #dc2626;
            font-weight: bold;
        }

        .status-pending {
            color: #d97706;
            font-weight: bold;
        }

        /* =====================================================
           الأزرار
        ===================================================== */

        .action {
            border: 0;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin: 2px;
        }

        .edit {
            background: #e5f0ff;
            color: #1769d1;
        }

        .toggle {
            background: #fef3c7;
            color: #92400e;
        }

        .activate {
            background: #dcfce7;
            color: #166534;
        }

        .disable {
            background: #fee2e2;
            color: #991b1b;
        }

        /* =====================================================
           بطاقات الخطط
        ===================================================== */

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 20px;
            margin-top: 25px;
        }

        .plan-card {
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 25px;
            background: #ffffff;
        }

        .plan-card h3 {
            color: #1769d1;
            margin-top: 0;
            font-size: 23px;
        }

        .plan-description {
            color: #666;
            line-height: 1.8;
            min-height: 55px;
        }

        .plan-meta {
            margin-top: 15px;
            padding: 12px;
            background: #f5f7fb;
            border-radius: 10px;
        }

        .plan-status {
            margin-top: 10px;
            font-weight: bold;
        }

        /* =====================================================
           النوافذ
        ===================================================== */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-box {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 25px;
        }

        .modal-box h2 {
            color: #1769d1;
            margin-top: 0;
        }

        .modal-box label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .modal-box input,
        .modal-box textarea,
        .modal-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .modal-box textarea {
            min-height: 110px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
