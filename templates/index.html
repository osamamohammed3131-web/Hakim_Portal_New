<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حكيم أكاديمي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #1769d1;
            font-size: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            border-radius: 22px;
            padding: 45px 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin: 0 0 15px;
            font-size: 34px;
            color: #111827;
        }

        .welcome p {
            margin: 0;
            font-size: 20px;
            color: #6b7280;
            line-height: 1.8;
        }

        .login-title {
            text-align: center;
            margin: 30px 0 20px;
            font-size: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px 25px;
            text-align: center;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin: 0 0 12px;
            color: #1769d1;
            font-size: 25px;
        }

        .card p {
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            background: #1769d1;
            color: white;
            padding: 13px 35px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }
