<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - حكيم أكاديمي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f6fa;
            color: #172033;
        }

        header {
            background: #ffffff;
            padding: 22px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            margin: 0;
            color: #1769d1;
            font-size: 30px;
        }

        .container {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            color: #1769d1;
        }

        .login-card p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1769d1;
            box-shadow: 0 0 0 3px rgba(23, 105, 209, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1769d1;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1258b0;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
            display: none;
        }

        .success {
            display: block !important;
            background: #ecfdf3;
            color: #18794e;
        }

        .error {
            display: block !important;
            background: #fff1f1;
            color: #b42318;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769d1;
            text-decoration: none;
        }

        .register {
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
        }

        .register a {
            color: #1769d1;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Hakim Academy</h1>
</header>

<div class="container">

    <div class="login-card">

        <h2>تسجيل الدخول</h2>

        <p>
            ادخل إلى حسابك في حكيم أكاديمي
        </p>

        <form id="loginForm">

            <label for="username">
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="أدخل اسم المستخدم"
                required
                autocomplete="username"
            >

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="أدخل كلمة المرور"
                required
                autocomplete="current-password"
            >

            <button type="submit" id="loginButton">
                تسجيل الدخول
            </button>

        </form>

        <div id="message"></div>

        <div class="register">
            ليس لديك حساب؟
            <a href="/register">إنشاء حساب طالب</a>
        </div>

        <a class="back" href="/">
            العودة إلى الرئيسية
        </a>

    </div>

</div>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        if (!username || !password) {
            showMessage(
                "فضلاً أدخل اسم المستخدم وكلمة المرور",
                "error"
            );
            return;
        }

        button.disabled = true;
        button.textContent = "جاري تسجيل الدخول...";

        try {

            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {

                showMessage(
                    data.error || "بيانات تسجيل الدخول غير صحيحة",
                    "error"
                );

                button.disabled = false;
                button.textContent = "تسجيل الدخول";

                return;
            }

            showMessage(
                "تم تسجيل الدخول بنجاح، جاري الانتقال...",
                "success"
            );

            setTimeout(function() {

                if (
                    data.user &&
                    (
                        data.user.role === "admin" ||
                        data.user.role === "superadmin"
                    )
                ) {
                    window.location.href = "/admin";
                } else {
                    window.location.href = "/student";
                }

            }, 700);

        } catch (error) {

            showMessage(
                "تعذر الاتصال بالخادم، حاول مرة أخرى",
                "error"
            );

            button.disabled = false;
            button.textContent = "تسجيل الدخول";
        }

    });
</script>

</body>
</html>
